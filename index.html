<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Stargazers log</h1>

      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
